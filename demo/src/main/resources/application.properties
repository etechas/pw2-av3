spring.application.name=pw2-av3

# Conexao com o Microsoft SQL Server (rode o script_banco.sql antes)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=AtiviPW;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:SUA_SENHA_AQUI}

# O banco e criado pelo script_banco.sql, o Hibernate nao altera o schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
